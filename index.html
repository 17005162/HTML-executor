<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲームポータル</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 10px; }
        .menu { margin-bottom: 15px; }
        select, button { padding: 8px 12px; font-size: 16px; margin-right: 5px; }
        #container { width: 100%; max-width: 960px; height: 540px; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h1>ゲームセレクター</h1>
    <div class="menu">
        <select id="gameSelector">
            <option value="">-- ゲームを選択してください --</option>
            <option value="game1.html">ゲーム1 (game1.html)</option>
            <option value="game2.html">ゲーム2 (game2.html)</option>
        </select>
        <button onclick="loadGame()">プレイする</button>
        <button onclick="toggleFullscreen()">画面いっぱいに拡大</button>
    </div>

    <div id="container">
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <script>
        function loadGame() {
            const select = document.getElementById('gameSelector');
            const frame = document.getElementById('gameFrame');
            if (select.value) {
                frame.src = select.value;
            } else {
                alert('ゲームを選択してください');
            }
        }

        function toggleFullscreen() {
            const container = document.getElementById('container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    alert('全画面表示に失敗しました: ' + err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
